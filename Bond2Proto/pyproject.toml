[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bond2Proto"
version = "0.0.1"
description = "A self-contained Bond-to-Protocol-Buffers command line tool"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.scripts]
b2p = "bond2proto.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bond2proto = [
    "bin/gbc.exe",
    "bond/core/*.bond",
    "skill/SKILL.md",
]
